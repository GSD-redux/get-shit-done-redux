<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSD UAT Workbench</title><style>body{font:16px system-ui;margin:0;color:#172033}main{max-width:960px;margin:auto;padding:24px}label{display:inline-grid;gap:4px;margin:0 12px 12px 0}section{margin:20px 0}.item{border:1px solid #d5d9e2;border-radius:6px;margin:8px 0;padding:12px}.muted{color:#526072}button:focus,input:focus,select:focus{outline:3px solid #2155d6;outline-offset:2px}button[disabled]{opacity:.55}</style></head>
<body><main><h1>GSD UAT Workbench</h1><p id="status" aria-live="polite">Connecting…</p><section aria-label="Filters"><label>Phase <select id="phase-filter"><option value="">All phases</option></select></label><label>Type <select id="type-filter"><option value="">All types</option><option value="uat">UAT</option><option value="verification">Verification</option><option value="deferred">Deferred</option></select></label></section><section><h2>Outstanding checks</h2><div id="items"></div></section></main>
<script>
'use strict';
let requestId=0,ready=false,pending=null,state=null,inFlight=false,reloadRequired=false,reloadMessage='';
const status=document.getElementById('status'),items=document.getElementById('items'),phaseFilter=document.getElementById('phase-filter'),typeFilter=document.getElementById('type-filter');
function send(method,params){const id=++requestId;parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return id}
const initId=send('ui/initialize',{protocolVersion:'2025-03-26',appInfo:{name:'GSD UAT Workbench',version:'1'},appCapabilities:{}});
function add(parent,tag,value){const node=document.createElement(tag);node.textContent=value==null?'—':String(value);parent.append(node);return node}
function canAct(file,item){return !reloadRequired&&file.type==='uat'&&!file.archived_milestone&&item.category==='pending'&&item.result==='pending'&&Number.isInteger(item.test)}
function render(data){state=data?.workbench||data;if(!state)return;items.replaceChildren();const phases=[...new Set((state.results||[]).map(file=>file.phase).filter(Boolean))];const selected=phaseFilter.value;phaseFilter.replaceChildren();add(phaseFilter,'option','All phases').value='';for(const phase of phases){const option=add(phaseFilter,'option',phase);option.value=phase}phaseFilter.value=phases.includes(selected)?selected:'';const phase=phaseFilter.value,type=typeFilter.value;for(const file of state.results||[]){if((phase&&file.phase!==phase)||(type&&file.type!==type))continue;const heading=add(items,'h3',`${file.phase||'Unscoped'} — ${file.type||'check'}`);heading.className='phase';if(file.parse_gap){const warning=add(items,'p','Some checks could not be parsed and remain read-only.');warning.className='muted'}for(const item of file.items||[]){const card=document.createElement('article');card.className='item';add(card,'h4',item.name||`Test ${item.test||'?'}`);add(card,'p',item.expected||item.truth||'No expected behavior provided.');add(card,'p',`${item.result||'unknown'}${item.reason?`: ${item.reason}`:''}`);if(canAct(file,item)){const noteLabel=document.createElement('label');noteLabel.textContent='Issue note';const note=document.createElement('input');note.name='note';note.required=true;noteLabel.append(note);const pass=document.createElement('button');pass.type='button';pass.textContent='Record pass';pass.disabled=inFlight;const issue=document.createElement('button');issue.type='button';issue.textContent='Record issue';issue.disabled=true;note.addEventListener('input',()=>{issue.disabled=!note.value.trim()||inFlight});const record=result=>{if(!ready||inFlight||reloadRequired||(result==='issue'&&!note.value.trim()))return;inFlight=true;for(const button of items.querySelectorAll('button'))button.disabled=true;status.textContent='Recording result…';send('tools/call',{name:'gsd_record_uat_result',arguments:{project_path:state.project_path,file_path:file.file_path,test_number:item.test,result,note:note.value.trim()}})};pass.addEventListener('click',()=>record('pass'));issue.addEventListener('click',()=>record('issue'));card.append(noteLabel,pass,issue)}else{const readonly=add(card,'p','Read-only');readonly.className='muted'}items.append(card)}}if(!items.childNodes.length)add(items,'p','No matching outstanding checks.');status.textContent=reloadRequired?reloadMessage:'UAT workbench loaded.'}
function payload(message){return message?.params?.structuredContent||message?.params||message?.result?.structuredContent||message?.result}
phaseFilter.addEventListener('change',()=>render(state));typeFilter.addEventListener('change',()=>render(state));
window.addEventListener('message',event=>{if(event.source!==parent)return;const message=event.data;if(!message||typeof message!=='object')return;if(message.id===initId){if(message.error){status.textContent=message.error.message||'Could not initialize the GSD UAT Workbench.';return}ready=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');if(pending)render(pending);return}if(message.method==='ui/notifications/tool-result'||message.id){const data=payload(message);if(message.error||data?.isError){inFlight=false;if(state)render(state);status.textContent=message.error?.message||data?.content?.[0]?.text||'The result was rejected.';return}if(data?.mutation&&data.workbench===null&&data.refresh_error){inFlight=false;reloadRequired=true;reloadMessage=`Result recorded, but the authoritative refresh failed: ${data.refresh_error} Reload this view before recording another result.`;if(state)render(state);else status.textContent=reloadMessage;return}if(data?.workbench){inFlight=false;if(ready)render(data.workbench);else pending=data.workbench}else if(message.method==='ui/notifications/tool-result'){if(ready)render(data);else pending=data}}});
</script></body></html>
