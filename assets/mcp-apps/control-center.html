<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSD Control Center</title></head>
<body><main><h1>GSD Control Center</h1><label>Project path <input id="project" type="text" autocomplete="off"></label><button id="load" type="button">Load planning</button><output id="result" aria-live="polite"></output></main>
<script>
'use strict';
let requestId = 0;
const result = document.getElementById('result');
parent.postMessage({ jsonrpc: '2.0', method: 'ui/initialize', params: {} }, '*');
function callTool(name, args) { const id = ++requestId; parent.postMessage({ jsonrpc: '2.0', id, method: 'tools/call', params: { name, arguments: args } }, '*'); return id; }
function render(value) { result.textContent = JSON.stringify(value, null, 2); }
document.getElementById('load').addEventListener('click', () => { result.textContent = 'Loading…'; callTool('gsd_control_center', { project_path: document.getElementById('project').value }); });
window.addEventListener('message', (event) => { const message = event.data; if (!message || typeof message !== 'object') return; if (message.method === 'ui/notifications/tool-result') render(message.params); else if (message.id && (message.result || message.error)) render(message.result || message.error); });
</script></body></html>
