<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GSD Control Center</title><style>body{font:16px system-ui;margin:0;color:#172033}main{max-width:960px;margin:auto;padding:24px}section{margin:20px 0}dl,table{width:100%;border-collapse:collapse}dt{font-weight:700}dd,td,th{padding:8px;border-bottom:1px solid #d5d9e2;text-align:left}button:focus,input:focus,select:focus{outline:3px solid #2155d6;outline-offset:2px}.muted{color:#526072}</style></head>
<body><main><h1>GSD Control Center</h1><p id="status" aria-live="polite">Connecting…</p><section><h2>Milestone</h2><dl id="milestone"></dl></section><section><h2>Active work</h2><dl id="active"></dl></section><section><h2>Progress</h2><dl id="progress"></dl></section><section><h2>Phases</h2><table><thead><tr><th>Phase</th><th>Verification</th><th>Roadmap acceptance</th><th>Unresolved UAT</th><th>Plans</th></tr></thead><tbody id="phases"></tbody></table></section><section><h2>Diagnostics</h2><ul id="diagnostics"></ul></section><section><h2>Next action</h2><p id="next-action" class="muted"></p></section></main>
<script>
'use strict';
let requestId=0, ready=false, pending=null;
const status=document.getElementById('status');
function send(method,params){const id=++requestId;parent.postMessage({jsonrpc:'2.0',id,method,params},'*');return id}
const initId=send('ui/initialize',{protocolVersion:'2025-03-26',appInfo:{name:'GSD Control Center',version:'1'},appCapabilities:{}});
function text(parent,value){const node=document.createElement('span');node.textContent=value==null?'—':String(value);parent.append(node)}
function pair(parent,label,value){const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;text(dd,value);parent.append(dt,dd)}
function count(value){return value&&typeof value==='object'&&'completed'in value?`${value.completed}/${value.total} (${value.percent==null?'withheld':`${value.percent}%`})`:value}
function acceptance(value){return value===true?'accepted':value===false?'not accepted':'unknown'}
function render(data){const milestone=document.getElementById('milestone'),active=document.getElementById('active'),progress=document.getElementById('progress'),phases=document.getElementById('phases'),diagnostics=document.getElementById('diagnostics');for(const node of [milestone,active,progress,phases,diagnostics])node.replaceChildren();const m=data.milestone||{},a=data.active||{},p=data.progress||{};pair(milestone,'Title',m.name);pair(milestone,'Scope',m.scope);pair(active,'Phase',a.phase&&a.phase.value);pair(active,'Plan',a.plan&&a.plan.value);pair(active,'Status',a.status&&a.status.value);pair(progress,'Accepted phases',count(p.accepted_phases));pair(progress,'Completed plans',count(p.completed_plans));for(const phase of data.phases||[]){const tr=document.createElement('tr'),unresolved=Array.isArray(phase.uat?.unresolved)?phase.uat.unresolved.length:0;for(const value of [phase.phase_id||phase.dir,phase.verification?.status,acceptance(phase.roadmap_acceptance?.checkbox),unresolved,phase.plan_count]){const td=document.createElement('td');text(td,value);tr.append(td)}phases.append(tr)}for(const item of data.diagnostics||[]){const li=document.createElement('li');li.textContent=item.detail||item.code||String(item);diagnostics.append(li)}const next=(data.phases||[]).map(phase=>phase.verification?.next_action).find(Boolean);document.getElementById('next-action').textContent=next||((data.diagnostics||[]).length?'Address the listed diagnostic or blocker before advancing.':'Review the active phase and continue its next planned step.');status.textContent='Planning snapshot loaded.'}
function payload(message){return message?.params?.structuredContent||message?.params||message?.result?.structuredContent||message?.result}
window.addEventListener('message',event=>{if(event.source!==parent)return;const message=event.data;if(!message||typeof message!=='object')return;if(message.id===initId){if(message.error){status.textContent=message.error.message||'Could not initialize the GSD Control Center.';return}ready=true;parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*');if(pending)render(pending);return}if(message.error){status.textContent=message.error.message||'Could not load the planning snapshot.';return}if(message.method==='ui/notifications/tool-result'){const data=payload(message);if(data?.isError){status.textContent=data.content?.[0]?.text||'Could not load the planning snapshot.';return}if(ready)render(data);else pending=data}});
</script></body></html>
