name: Sweep spent ack fragments

# Companion to the `guard-no-ack-on-next` job in test.yml. That job DETECTS a
# fully-spent emitted-drift-ack fragment surviving on `next` and reds the branch;
# until #3875 the only remedy was a human reading CI prose and hand-authoring a
# `git rm` PR. That remedy is structurally unable to keep up: the guard evaluates
# dynamically at MERGE time, while a hand-authored sweep is a static set of
# deletions fixed at BRANCH time, so any ack-carrying PR that merges in between
# invalidates it. #3823 lost that race to #3809 on its own merge commit and left
# `next` red for 24 consecutive pushes.
#
# This sweep closes that window by deriving the deletion list from the guard
# ITSELF (`--sweep-plan`), on a timer, immediately before acting on it. It opens a
# PR rather than pushing to `next` directly: `next` is protected, and an
# acknowledgment is a reviewed artifact, so a human still approves the deletion.

on:
  schedule:
    - cron: '30 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ack-fragment-sweep
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    name: Sweep all-spent ack fragments on next
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: next
          # The guard reads each surviving fragment at the commit before HEAD.
          # Full history, not depth 2: the sweep branch is pushed from here, and
          # a shallow clone cannot be pushed to a protected-branch repo cleanly.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24

      - name: Compute the sweep plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # stdout is the machine-readable plan, stderr the guard's own prose —
          # the prose is teed into the job log so a run that sweeps nothing still
          # explains why (including which fragments the #3842 open-PR hold kept).
          #
          # `--defer-to-open-prs` is NOT optional here. Without it the plan names
          # every all-spent fragment including ones an open PR still modifies, and
          # deleting one of those hands that PR a modify/delete conflict it did not
          # cause — the exact failure #3842 exists to prevent.
          #
          # The hold is evaluated at PLAN time, not at merge time, so it narrows but
          # does not eliminate the conflict window: a PR opened after this step runs
          # that re-arms a planned fragment by appending prose to it can still meet a
          # modify/delete when this sweep lands. That residue is why the sweep opens a
          # reviewable PR rather than pushing to `next` — a human sees the diff, and
          # a conflict surfaces as a normal merge conflict on a bot PR rather than as
          # a surprise on someone else's.
          #
          # No `--base-ref`: a scheduled run has no `github.event.before`, so the
          # script's own `HEAD^` fallback applies. Note what that fallback actually
          # does — it is NOT simply conservative. On a rebase-merge landing N>=2
          # commits whose first adds a fragment, `HEAD^` lands on that first commit,
          # reads the fragment as already present, and plans it (the script says so
          # itself, at `resolveBaseRef`). That is acceptable HERE, and only here: a
          # fragment that has reached `next` is spent by the lifecycle definition
          # regardless of which commit of the push carried it, and the open-PR hold
          # below still protects any PR that is still touching it. The same fallback
          # would be wrong for the push-lane guard, which is exactly why test.yml
          # passes `github.event.before` explicitly instead.
          # `|| true` would be wrong here. In plan mode the script exits 0 for
          # EVERY verdict, so a non-zero status is a real fault — a crash, an
          # unreadable base ref, a rejected flag — and must fail the job loudly.
          # Swallowing it would leave plan.txt empty and report the fault as the
          # cheerful "nothing to sweep", which is the silent-failure class this
          # whole ack seam exists to end.
          set +e
          node scripts/lint-emitted-drift-ack.cjs \
            --guard-next --sweep-plan --defer-to-open-prs \
            > plan.txt 2> prose.txt
          guard_status=$?
          set -e
          echo '--- guard output ---'
          cat prose.txt
          if [ "$guard_status" -ne 0 ]; then
            echo "::error::guard exited ${guard_status} in plan mode — that is a fault, not a verdict"
            exit 1
          fi

          if [ ! -s plan.txt ]; then
            # An empty plan has two very different causes, and reporting both as
            # "nothing to sweep" is how this automation would go quietly inert.
            #
            # Cause A: `next` is clean. Nothing to do, and silence is right.
            #
            # Cause B: every all-spent fragment is HELD by an open PR — and the
            # commonest such PR is the sweep PR THIS WORKFLOW opened last run, which
            # touches exactly the fragments it proposed to delete. So run #2 onward
            # would report a cheerful green while `next` stays red and the sweep PR
            # rots unmerged. Re-running the guard WITHOUT the hold separates the two:
            # a non-empty unheld set with an empty plan means "blocked, not done".
            set +e
            node scripts/lint-emitted-drift-ack.cjs \
              --guard-next --sweep-plan > unheld.txt 2>/dev/null
            unheld_status=$?
            set -e
            if [ "$unheld_status" -eq 0 ] && [ -s unheld.txt ]; then
              open_sweep=$(gh pr list --base next --state open \
                --json number,headRefName \
                --jq '[.[] | select(.headRefName | startswith("chore/ack-sweep-"))] | .[0].number // empty' \
                2>/dev/null || echo "")
              if [ -n "$open_sweep" ]; then
                echo "::warning::next still carries spent ack fragment(s); sweep PR #${open_sweep} is open and awaiting merge. Nothing further this run."
              else
                echo '::warning::next still carries spent ack fragment(s), but every one is held by an open PR that touches it (#3842). They will be swept once those PRs merge or close.'
              fi
              echo 'held fragments:'
              cat unheld.txt
            else
              echo 'nothing to sweep'
            fi
            echo 'empty=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Every planned path is re-validated before anything is deleted, against
          # a strict allowlist rather than a shape check. The plan comes from our
          # own script, but the fragment BASENAMES in it come from readdirSync and
          # are filtered only on the `.json` suffix, so any filename a merged PR
          # can land in that directory reaches this point.
          #
          # Two concrete attacks this closes. (1) A file literally named `*.json`
          # is a valid filename and passes a `tests/emitted-drift-acks/*.json`
          # glob test — and `git rm` treats each argument as a PATHSPEC, so it
          # would then expand to every fragment in the tree, including ones the
          # #3842 open-PR hold deliberately withheld. Verified locally: one such
          # file deletes all of them. (2) A filename containing backticks or
          # newlines is interpolated into the PR body below, injecting markdown
          # into a document this repo's review agents read.
          #
          # The allowlist admits only a leading alphanumeric followed by
          # alphanumerics, dot, underscore and hyphen — no glob metacharacters, no
          # whitespace, no backticks, no slash, so no traversal and no leading `-`
          # for git to read as an option. A filename containing a newline arrives
          # here as two lines, each of which fails the pattern: it fails closed.
          #
          # The plan carries two shapes: the legacy single document at a fixed path
          # (`tests/emitted-drift-ack.json`), whose mere PRESENCE reds `next`, and
          # fragment basenames under `tests/emitted-drift-acks/`. The legacy path is
          # matched exactly and literally; only the fragment arm takes a name pattern.
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            if ! printf '%s' "$line" \
              | grep -qE '^(tests/emitted-drift-ack\.json|tests/emitted-drift-acks/[A-Za-z0-9][A-Za-z0-9._-]*\.json)$'; then
              echo "::error::refusing to sweep unexpected path: $line"
              exit 1
            fi
            if [ ! -f "$line" ]; then
              echo "::error::planned path is not a file: $line"
              exit 1
            fi
          done < plan.txt

          echo 'empty=false' >> "$GITHUB_OUTPUT"
          echo 'planned fragments:'
          cat plan.txt

      - name: Open the sweep PR
        if: steps.plan.outputs.empty == 'false'
        env:
          GH_TOKEN: ${{ secrets.GSD_BOT_PR_TOKEN || secrets.GITHUB_TOKEN }}
          HAS_BOT_TOKEN: ${{ secrets.GSD_BOT_PR_TOKEN != '' && '1' || '' }}
        run: |
          set -euo pipefail
          # `GITHUB_TOKEN` cannot raise workflow runs for the events it creates, so a
          # PR opened under the fallback never reports a single required check and
          # sits permanently pending. That is a silent, confusing failure, so it is
          # announced rather than discovered.
          if [ -z "${HAS_BOT_TOKEN:-}" ]; then
            echo '::warning::GSD_BOT_PR_TOKEN is unset; opening the sweep PR with GITHUB_TOKEN. No required checks will run on it and it will not be mergeable until a maintainer pushes to the branch.'
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          BR="chore/ack-sweep-${SHORT_SHA}"

          # An earlier run may already have opened a sweep PR for this same tip.
          EXISTING=$(gh pr list --base next --head "$BR" --state open --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "sweep PR #${EXISTING} already open for ${SHORT_SHA}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BR"

          # `:(literal)` pathspec magic, one path per call. `--` stops OPTION
          # parsing but git still reads each remaining argument as a pathspec with
          # wildmatch semantics, so a fragment named `*.json` would expand to every
          # fragment in the directory. `:(literal)` disables that globbing and makes
          # each argument mean exactly the bytes it contains. The allowlist in the
          # plan step already rejects such a name; this is the second, independent
          # layer, because over-deletion here is unrecoverable within the run.
          while IFS= read -r frag; do
            [ -n "$frag" ] || continue
            git rm -q -- ":(literal)${frag}"
          done < plan.txt

          COUNT=$(grep -c . plan.txt)
          LIST=$(sed 's/^/- /' plan.txt)

          git commit -q -m "chore(#3875): sweep ${COUNT} spent ack fragment(s) from next"

          # A previous run can have pushed this branch and then died before
          # `gh pr create`, or a human can have closed the PR without deleting the
          # branch. In both cases the open-PR probe above finds nothing, the rebuilt
          # commit gets a fresh committer timestamp and therefore a different sha,
          # and a plain push is rejected as non-fast-forward — every six hours,
          # forever, with no path to sweep that tip. Re-point the stale branch
          # instead, under a lease so a branch someone else has moved is never
          # clobbered blind.
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            git fetch -q origin "$BR"
            git push -q --force-with-lease="${BR}:$(git rev-parse FETCH_HEAD)" origin "$BR"
          else
            git push -q origin "$BR"
          fi

          # No apostrophes in this heredoc body: bash scans $( ) for quotes before
          # it recognises the nested heredoc, so a lone ' here is an unterminated
          # quote and a hard syntax error at runtime, not just under `bash -n`.
          BODY=$(cat <<EOF
          Automated sweep of fully-spent emitted-drift-ack fragment(s) surviving on \`next\`.

          Every entry in each fragment below is already at the base, so it is spent and
          gates nothing (#2789) — but it still OWNS its path keys, which walls off the
          next PR that grows one of them (#3078). Leaving them in place reds \`next\` on
          every push.

          ${LIST}

          The list was produced by \`lint-emitted-drift-ack.cjs --guard-next --sweep-plan
          --defer-to-open-prs\` — the same computation the \`guard-no-ack-on-next\` job
          runs — so it reflects the verdict the guard itself produced at \`${SHORT_SHA}\`, not a
          re-derived or hand-maintained list. Any fragment an open PR still touches was
          held back rather than swept (#3842).

          Refs #3875. Generated by \`.github/workflows/ack-fragment-sweep.yml\`.
          EOF
          )

          PR_URL=$(gh pr create \
            --base next \
            --head "$BR" \
            --title "chore: sweep spent ack fragments from next (${SHORT_SHA})" \
            --body "$BODY")
          PR="${PR_URL##*/}"
          echo "opened ${PR_URL}"

          # no-changelog: deleting spent acknowledgment paperwork is not a
          # user-facing change, so it carries no changeset fragment.
          #
          # Not `|| true`: `no-changelog` is what exempts this PR from the changeset
          # gate, so losing it leaves the PR red for a reason that has nothing to do
          # with its contents. Still non-fatal — the PR itself is already open and
          # useful — but it must be visible.
          if ! gh pr edit "$PR" --add-label automation --add-label no-changelog; then
            echo "::warning::could not label PR #${PR}; the changeset gate will need the no-changelog label applied by hand."
          fi
