name: Issue Version Gate

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  issues: write
  contents: read

jobs:
  gate:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const gate = require(`${process.env.GITHUB_WORKSPACE}/scripts/issue-version-gate.cjs`);
            const issue = context.payload.issue;
            if (!issue) return;
            if (issue.pull_request) return;
            const labels = (issue.labels || []).map((l) => (typeof l === 'string' ? l : l.name));
            const result = gate.evaluateVersionGate({ labels, body: issue.body || '' });
            core.info(`version-gate: #${issue.number} → ${result.action} (${result.reason})`);
            if (result.action !== 'close') return;
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: issue.number,
                labels: [gate.NEEDS_VERSION_LABEL],
              });
            } catch (err) {
              core.warning(`could not add ${gate.NEEDS_VERSION_LABEL} label: ${err.message}`);
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: gate.renderCloseComment(),
            });
            await github.rest.issues.update({
              owner, repo, issue_number: issue.number,
              state: 'closed', state_reason: 'not_planned',
            });

  # DEFECT.CANARY-VERSION-LEAK: package.json .version must never carry a
  # -canary.<N> suffix on main — that suffix is a dev-branch marker. Explicit
  # base-branch condition below (not just the trigger's `branches: [main]`
  # filter) so the gate is unambiguous even if the trigger is ever widened.
  canary-version-leak:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reject a -canary.<N> version landing on main
        run: node scripts/lint-canary-version-leak.cjs
