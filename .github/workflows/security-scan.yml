name: Security Scan

on:
  pull_request:
    branches:
      - next
      - main
      - 'release/**'
      - 'hotfix/**'
    paths:
      - 'gsd-core/**'
      - 'agents/**'
      - 'commands/**'
      - 'hooks/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/security-scan.yml'
      - '.secretscanignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # #3833: no compute lane runs while the PR has a merge conflict. No-ops on
  # push and workflow_dispatch, so this dependency is unconditional.
  preflight:
    name: PR mergeability
    uses: ./.github/workflows/pr-mergeable-preflight.yml
    permissions:
      contents: read
      pull-requests: read

  security:
    needs: preflight
    runs-on: ubuntu-latest
    # 30m (was 10m): the base64 scan is O(changed-files); a very large diff
    # (e.g. the #604 repo-wide rename, ~800 changed files) can exceed 10m. The
    # scan itself is unchanged; this only raises the ceiling for big diffs.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity gate
        run: node scripts/check-npm-integrity.cjs

      # ADR-3889 Phase 4 (#3908): the scanners now distinguish "ran, zero
      # files in scope" (NO_INPUT, e.g. a docs/image-only PR) from "could not
      # establish scope" (UNAVAILABLE, e.g. a bad ref or unreadable input) —
      # previously both collapsed to a silent exit 0. NO_INPUT must still
      # PASS this job (nothing was in scope to scan); UNAVAILABLE must FAIL
      # it (the scan never actually ran). Each step sources the generated
      # exit-code fragment rather than hardcoding the NO_INPUT integer, and
      # only recodes exactly that one outcome to 0 — every other exit code
      # (0, UNAVAILABLE, findings) passes through unchanged.
      - name: Prompt injection scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/prompt-injection-scan.sh
          . gsd-core/bin/shared/exit-codes.sh
          set +e
          scripts/prompt-injection-scan.sh --diff "origin/$BASE_REF"
          code=$?
          set -e
          if [ "$code" -eq "$EXIT_NO_INPUT" ]; then
            echo "prompt-injection-scan: NO_INPUT — nothing in scope, treated as pass"
            exit 0
          fi
          exit "$code"

      - name: Base64 obfuscation scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/base64-scan.sh
          . gsd-core/bin/shared/exit-codes.sh
          set +e
          scripts/base64-scan.sh --diff "origin/$BASE_REF"
          code=$?
          set -e
          if [ "$code" -eq "$EXIT_NO_INPUT" ]; then
            echo "base64-scan: NO_INPUT — nothing in scope, treated as pass"
            exit 0
          fi
          exit "$code"

      - name: Secret scan
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          chmod +x scripts/secret-scan.sh
          . gsd-core/bin/shared/exit-codes.sh
          set +e
          scripts/secret-scan.sh --diff "origin/$BASE_REF"
          code=$?
          set -e
          if [ "$code" -eq "$EXIT_NO_INPUT" ]; then
            echo "secret-scan: NO_INPUT — nothing in scope, treated as pass"
            exit 0
          fi
          exit "$code"

      - name: Secret scan exclusion lint
        run: |
          chmod +x scripts/secret-scan-lint.sh
          scripts/secret-scan-lint.sh --file .secretscanignore

      - name: Planning directory check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Ensure .planning/ runtime data is not committed in PRs
          # (The GSD repo itself has .planning/ in .gitignore, but PRs
          # from forks or misconfigured clones might include it)
          PLANNING_FILES=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF"...HEAD | grep '^\.planning/' || true)
          if [ -n "$PLANNING_FILES" ]; then
            echo "FAIL: .planning/ runtime data must not be committed to PRs"
            echo "The following .planning/ files were found in this PR:"
            echo "$PLANNING_FILES"
            echo ""
            echo "Add .planning/ to your .gitignore and remove these files from the commit."
            exit 1
          fi
          echo "planning-dir-check: clean"
