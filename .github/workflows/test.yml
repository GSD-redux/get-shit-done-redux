name: Tests

on:
  push:
    branches:
      - next
      - main
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - next
      - main
  # #4241: GitHub's merge queue fires `merge_group`, not `pull_request` or
  # `push`, for the temporary merge-group commit it creates. Without this
  # trigger, `required-tests` (the registered "Required tests" branch-
  # protection check) never schedules for a queued PR and the queue stalls
  # waiting on a check that never runs. See:
  # https://docs.github.com/en/actions/how-tos/using-features-for-actions/using-merge-queues
  # This is prerequisite wiring only — the merge queue itself is enabled via
  # a separate, manual "Require merge queue" branch-protection toggle.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # #3833: a conflicted PR must provision no compute runner. The gate fails OPEN
  # on everything except an explicit `mergeable: false`, and it no-ops (exit 0,
  # zero API calls) on push and workflow_dispatch — so this job is safe to make
  # an unconditional dependency of the lanes below.
  #
  # `changes` is deliberately NOT gated: it is a 2-minute scope classifier that
  # runs in parallel with this job, and serializing it behind the preflight
  # would add latency to every healthy PR for no saving.
  preflight:
    name: PR mergeability
    uses: ./.github/workflows/pr-mergeable-preflight.yml
    permissions:
      contents: read
      pull-requests: read

  # #4422: three unrelated PRs merged on top of an already-broken `next` on
  # 2026-09-06 before anyone noticed — nothing checked the base branch's OWN
  # health before letting a PR land on it. This job queries the GitHub API for
  # the base branch's last push-triggered Tests run and blocks the merge if it
  # is red, with a `fix-next` label escape hatch for the PR that is itself the
  # fix-forward. See scripts/ci-next-health.cjs's header for the full risk-
  # asymmetry reasoning (it deliberately does NOT fail open on a definite red
  # signal, unlike the mergeability preflight above).
  #
  # No `if:` guard, for the same reason `preflight` has none: a SKIPPED
  # dependency skips its dependents exactly like a failed one, so guarding this
  # job would skip `required-tests` on every push/workflow_dispatch run too.
  # scripts/ci-next-health.cjs itself no-ops (zero API calls, exit 0) on any
  # event other than pull_request/merge_group.
  #
  # `next-health` is likewise deliberately NOT gated behind `preflight`, same
  # rationale as `changes` above: it is a ~2-minute, compute-free API read that
  # runs in parallel with the preflight job, and serializing it behind
  # `preflight` would add latency to every healthy PR for no saving.
  next-health:
    name: Base branch health
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the next-health script from the base branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          # Same rationale as pr-mergeable-preflight.yml's checkout: pinned to
          # the BASE sha so the script that decides the gate comes from a
          # trusted commit, never PR-supplied code. Empty on a non-pull_request
          # event (e.g. merge_group), where actions/checkout falls back to the
          # triggering ref — fine, since the script no-ops before reading
          # anything on those events too.
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          sparse-checkout: |
            scripts
          persist-credentials: false

      - name: Check base branch health
        id: check
        env:
          # Every value arrives through env. CONTRIBUTING.md forbids `${{ }}`
          # inside a `run:` block.
          GITHUB_TOKEN: ${{ github.token }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          # Bootstrap arm, mirroring pr-mergeable-preflight.yml's: the checkout
          # above is of the BASE sha, so this step runs the script as it exists
          # on the base branch — which means it is absent on the PR that
          # INTRODUCES it, and on any PR branched from a base predating it.
          # Absent is not "red": it is one more thing we cannot determine, so
          # it takes the same fail-open path as any other unresolved read.
          # Self-healing — once the script is on the base branch this arm never
          # fires again.
          if [ ! -f scripts/ci-next-health.cjs ]; then
            echo "::warning::scripts/ci-next-health.cjs is not present at the base sha; skipping the base-branch health gate (fail-open). Expected on the PR that introduces it, or on a branch whose base predates it."
            echo "verdict=INDETERMINATE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci-next-health.cjs

  changes:
    name: Detect test scope
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code_changed: ${{ steps.scope.outputs.code_changed }}
      full_matrix: ${{ steps.scope.outputs.full_matrix }}
      product_changed: ${{ steps.scope.outputs.product_changed }}
      targeted_tests: ${{ steps.scope.outputs.targeted_tests }}
      windows_tests: ${{ steps.scope.outputs.windows_tests }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Classify changed paths
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            {
              echo "code_changed=true"
              echo "product_changed=true"
              echo "full_matrix=true"
              echo "targeted_tests="
              echo "windows_tests="
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Test scope"
              echo ""
              echo "- event: \`$EVENT_NAME\`"
              echo "- code_changed: \`true\`"
              echo "- full_matrix: \`true\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          node scripts/ci-test-scope.cjs --base "$BASE_SHA" --head "$HEAD_SHA" | tee ci-test-scope.json
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('ci-test-scope.json', 'utf8'));
          console.log('## Test scope');
          console.log('');
          console.log(`- code_changed: \`${result.code_changed}\``);
          console.log(`- full_matrix: \`${result.full_matrix}\``);
          console.log(`- targeted_tests: \`${result.targeted_tests.length}\``);
          console.log(`- windows_tests: \`${result.windows_tests.length}\``);
          if (result.reasons.length > 0) {
            console.log('');
            console.log('### Reasons');
            for (const reason of result.reasons) console.log(`- ${reason}`);
          }
          NODE

  # Static lint: test-suite and PR-check contracts.
  # Runs once, not per matrix lane.
  lint-tests:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: true
          token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm ci --ignore-scripts
      # ADR-457 build-at-publish: bin/lib/*.cjs are gitignored, built by tsc.
      # --ignore-scripts skips the prepare build, but lint:skill-deps (and other
      # lint scripts) require() the built modules — so build them explicitly.
      - name: Build runtime lib (required by lint scripts)
        run: npm run build:lib
      # Single orchestrated lint entry point (npm run lint:ci) so local and CI
      # always run the identical set. It composes `npm run lint`, keeping one
      # eslint invocation home; the --cache flag inside it is a no-op in CI
      # (node_modules/.cache is never restored) but still speeds local runs.
      # Each sub-lint prints its own banner, so a failure identifies itself.
      - name: Lint — all (ESLint, skill deps, test-file count, command contract, PR checks, legacy name, regression-test names, resolution-provenance)
        run: npm run lint:ci

  # #3751 (decision 1): provision the claude CLI so plugin-manifest's C2 tier
  # (`claude plugin validate --strict`) is a real CI gate instead of a
  # local-only check. Dedicated job — the matrix lanes stay CLI-free.
  plugin-validate:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # #2665 round 4: every job that runs the suite wires the strict guard
      # (job-level env, where the live-config-guard derivation reads it).
      GSD_STRICT_LIVE_CONFIG_GUARD: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
      - name: Install dev dependencies
        run: npm ci --ignore-scripts
      - name: Install claude CLI (C2 gate dependency, #3751)
        run: npm install -g @anthropic-ai/claude-code
      - name: Run plugin-manifest suite (C1+C2+C3)
        run: node scripts/run-tests.cjs --files plugin-manifest.test.cjs

  test:
    name: test (${{ matrix.os }}, ${{ matrix.node-version }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})
    needs: [changes, preflight]
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ${{ matrix.os }}
    # #2952: the `scope: full` lane is sharded three ways (see the matrix
    # below), so the budget covers ONE shard, not the whole unit suite.
    #
    # #4070: the run 30677442953 figure this comment used to cite (shard 1/3
    # 7m12s) predated the aux-suite growth below and was stale. Shard 1 is the
    # long pole because the unsharded aux suites
    # (integration/security/install/slow) ride along on it — that is
    # deliberate, but their combined cost grew well past what was budgeted for
    # it (see the matrix comment below), which structurally overloaded shard 1
    # relative to shards 2/3: real measured totals hit 13m48s (run
    # 33278340189) and CANCELLED at ~14m51s / 99% of the old 15-minute cap
    # (run 33285384930). Fixed by RUN_TESTS_SHARD_RESERVE below, which tells
    # the LPT unit-test packer (scripts/run-tests.cjs's selectShard) to give
    # shard 1 a smaller unit-test share, offsetting its fixed aux-suite cost —
    # see tests/run-tests-harness.test.cjs's "selectShard reserved-weight
    # partition (#4070)" for the packer-side proof and
    # tests/ci-full-lane-sharding.test.cjs for the workflow-wiring guard.
    #
    # 21 is 1.5x the 14-minute pre-fix worst measurement (ceil(14*1.5)=21) —
    # tests/ci-test-job-timeout-budget.test.cjs enforces this arithmetic, not
    # just this comment. The rebalancing above only improves shard 1's real
    # margin against this cap further; the cap itself is sized to the
    # real evidence in hand, not to an unmeasured optimistic estimate. Before
    # sharding this same lane ran 15m20s against a 15-minute cap and was
    # killed mid-run (#2952) — the number changing here is not a repeat of
    # that failure mode, it is re-basing the SAME headroom policy on a number
    # that had gone stale.
    #
    # The `scope: windows` lane is sharded three ways for the same reason
    # (see #3057): on PR #3094 it reached 15m05s against a 15-minute cap and
    # was CANCELLED, four shas in a row — a change to tests/helpers.cjs scoped
    # in the install-heavy suites and pushed the single Windows lane over the
    # top. Per #869, a timeout bump only moves that cliff; sharding removes
    # it. That lane does not run any aux suite on its own shard 1 (the
    # aux-suite `if:` conditions below are gated on `scope == 'full'`
    # specifically), so it needs no reserve and is unaffected by this cap
    # change beyond sharing the same job-level `timeout-minutes`.
    # tests/ci-test-job-timeout-budget.test.cjs holds every lane here to a
    # headroom factor over its own measured cost.
    timeout-minutes: 32
    env:
      GSD_PLUGIN_ROOT: .ci-gsd-plugin-root-disabled
      # #2665: a live-config leak fails the run on Linux/macOS lanes. Windows
      # stays report-only: the guard's first run found PRE-EXISTING USERPROFILE
      # leaks there (~190 test sites sandbox HOME alone), a documented separate
      # class — promote once that sweep lands (see live-config-guard.cjs SEVERITY).
      GSD_STRICT_LIVE_CONFIG_GUARD: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      # #2854: pin the emitted gate's baseline to the SAME commit the tree was merged
      # with. "Rebase check" merges `pull_request.base.sha` (pinned by #2472 so all 12
      # matrix jobs agree on one tree), but `resolveBase()` otherwise falls through to
      # `origin/next`, which `fetch-depth: 0` leaves at the LIVE tip. Whenever `next`
      # advanced mid-flight the gate compared a tree built on base.sha against a
      # baseline at a newer commit — so the correctly-keyed cache was rejected as
      # "stale" and the run hard-failed on diffs that touched nothing related.
      # This must stay equal to CI_REBASE_BASE_SHA; a test asserts that parity.
      GSD_EMITTED_BASE: ${{ github.event.pull_request.base.sha }}
      # #4196: pin the npm-audit baseline the SAME way GSD_EMITTED_BASE pins
      # its own baseline (see the comment above) -- origin/next is live under
      # fetch-depth: 0 and can advance mid-run; base.sha is fixed for the life
      # of the run. For a push event, github.event.before is git's own record
      # of the ref's state immediately before this push landed -- correct
      # even when a rebase-merged PR lands as multiple discrete commits in
      # one push (HEAD~1 would be wrong there: it could already contain an
      # earlier commit's newly-introduced vulnerable package, masking it).
      # #4241: a merge_group event carries no pull_request/push context, so
      # without this arm it silently fell through to the '' branch --
      # resolveBaselineRef()'s documented-unreachable origin/next live-tip
      # fallback (npm-audit-baseline.cjs), reopening the exact race #4196
      # fixed, but only for merge-queue runs. github.event.merge_group.base_sha
      # is "the SHA of the merge group's parent commit" (GitHub's merge_group
      # webhook payload) -- the base tip the temporary merge-group commit was
      # built against, pinned for the life of the run same as the other two arms.
      AUDIT_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Required default PR lanes: fast signal (targeted scope), primary
          # runtime (full scope, sharded), and one Windows shell/path lane. The
          # Node floor is 24 (engines.node >=24.0.0), so the fast-signal lane
          # runs the same Node version as the full-scope lanes; only the test
          # selection (scope: targeted vs full) differs. The non-primary
          # OS/runtime lanes run scoped tests from scripts/ci-test-scope.cjs;
          # Ubuntu/Node 24 runs the broader default suite.
          #
          # #2952: the `scope: full` lane is SHARDED three ways. It was the only
          # unsharded lane in this file, and the whole unit suite under c8 on one
          # runner grew until it blew a 15-minute cap and reddened `next`. Raising
          # the cap treated the symptom; sharding changes the shape. Shards are
          # partitioned by MEASURED per-file duration (tests/test-timings.json)
          # using LPT in scripts/run-tests.cjs — the same cost-aware packer #2472
          # gave the `test-full` lane, which measures 0.0% spread across 3 bins on
          # the current table. The aux suites (integration/security/install/slow)
          # run on shard 1 only — sharding them too was evaluated and rejected for
          # #4070 (see tests/run-tests-harness.test.cjs's "selectShard
          # reserved-weight partition (#4070)" comment for the full trade-off):
          # they now cost ~216-224s combined (issue #4070's cited evidence — more
          # than double the ~1m35s this comment used to claim), and
          # `install`/`slow` spawn real subprocesses whose per-invocation startup
          # overhead a 3-way split would triple. Instead `RUN_TESTS_SHARD_RESERVE`
          # below reserves that fixed cost out of shard 1's LPT unit-test share, so
          # shard 1 gets fewer unit-test files rather than more aux-suite runs.
          #
          # #3057: the `scope: windows` lane is now sharded three ways too, the
          # same fix applied to the same cliff (#869's stated durable follow-up).
          # It hit exactly 15m05s and was CANCELLED on PR #3094, four shas
          # straight, after a change to tests/helpers.cjs scoped in the
          # install-heavy suites. Its shards use the same `--shard i/n`
          # flag on scripts/run-tests.cjs, applied AFTER scope selection.
          - os: ubuntu-latest
            node-version: 24
            scope: targeted
          - os: ubuntu-latest
            node-version: 24
            scope: full
            shard: 1/3
          - os: ubuntu-latest
            node-version: 24
            scope: full
            shard: 2/3
          - os: ubuntu-latest
            node-version: 24
            scope: full
            shard: 3/3
          - os: windows-latest
            node-version: 24
            scope: windows
            shard: 1/3
          - os: windows-latest
            node-version: 24
            scope: windows
            shard: 2/3
          - os: windows-latest
            node-version: 24
            scope: windows
            shard: 3/3

    steps:
      # Windows lane on checkout v5.0.1 (drops includeIf; no auth flake, uses Node 24 natively).
      # v6 uses includeIf.gitdir: for auth injection; on Windows git 2.54 the path comparison is
      # unreliable (https://github.com/actions/checkout/pull/2425). v5 never used includeIf.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (Windows)
        if: runner.os == 'Windows'
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (Linux/macOS)
        if: runner.os != 'Windows'
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Record job start time (near-cap check)
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "CI_JOB_START_EPOCH_MS=" + Date.now() + "\n")'

      - name: Guard — require GitHub-hosted runner
        run: node scripts/ci-guard-runner.cjs

      - name: Rebase check — merge PR base branch into PR head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pin every job of this run to ONE base commit (#2472). Each job runs
          # this step independently, minutes apart across a 12-job matrix, so
          # merging the moving branch ref lets jobs see different trees when the
          # base advances mid-run. The sharded lane needs all jobs to agree on a
          # partition, and disagreement there drops a test file silently while
          # CI stays green. base.sha is fixed for the life of the run.
          CI_REBASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-rebase-check.cjs

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Environment check
        run: npm run check:env

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity gate
        run: node scripts/check-npm-integrity.cjs

      # #2724 (ADR-2719 §5): the differential attribution check's baseline is cached,
      # not committed. This restores what the push-to-next job published, keyed on
      # the PR's base sha — the "next sha the PR was merged with" the ADR requires,
      # and the same commit `ci-rebase-check` merged into this tree.
      #
      # #2854: the restore lands on resolveBaseline()'s DEFAULT_CACHE_PATH, so it is
      # found without being announced. There used to be a step that published this
      # path to GSD_EMITTED_BASELINE — an OPERATOR PIN, where any rejection is a hard
      # stop rather than a fall-through. That converted every recoverable condition
      # (stale, malformed, wrong schema version) into a fatal CI failure on diffs that
      # touched nothing related. Restoring to the default path and saying nothing lets
      # a bad artifact degrade to the in-job build, which is what ADR-2719 §5 specifies.
      - name: Restore emitted-baseline cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .gsd-cache/emitted-baseline.json
          key: emitted-baseline-${{ github.event.pull_request.base.sha }}

      - name: Prepare scoped test list
        if: matrix.scope != 'full'
        env:
          TEST_SCOPE: ${{ matrix.scope }}
          TARGETED_TESTS: ${{ needs.changes.outputs.targeted_tests }}
          WINDOWS_TESTS: ${{ needs.changes.outputs.windows_tests }}
        run: node scripts/ci-prepare-test-scope.cjs

      - name: Run scoped tests
        if: matrix.scope != 'full'
        run: node scripts/run-tests.cjs --files-from .ci-selected-tests.txt${{ matrix.shard && format(' --shard {0}', matrix.shard) || '' }}

      # #2952: each shard runs its slice of the unit suite under c8 but renders
      # NO report and enforces NO gate — it only leaves raw V8 dumps in
      # coverage/tmp. A per-shard percentage is meaningless (shard 2 never
      # executes shard 1's files, so every file outside its slice reads 0%), so
      # the gate has to see all three slices merged. The `coverage-gate` job
      # below does that. Both call the SAME npm scripts, so the c8 globs and the
      # ≥70% lib / ≥55% scripts floor thresholds stay defined once, in package.json.
      - name: Run unit tests (shard ${{ matrix.shard }}, raw coverage only)
        if: matrix.scope == 'full'
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # #4070: shard 1 alone also runs the four aux suites below (see their
          # comment) — a fixed cost this step's own LPT packer has no other way
          # to see. Reserving it out of shard 1's unit-test share (in LPT weight
          # units, not milliseconds — see scripts/run-tests.cjs's
          # parseShardReserve/selectShard) is what keeps shard 1 from carrying
          # both its full unit-test share AND the aux-suite cost on top. Gated on
          # `scope == 'full'` specifically, NOT on `matrix.shard == '1/3'` alone,
          # because the SAME literal must reach all three full-scope shards'
          # invocations identically — each recomputes the whole 3-way partition
          # independently and must agree on it (see the `sig` cross-job
          # fingerprint diagnostic further down in run-tests.cjs). The
          # `scope: windows` lane runs no aux suite on its own shard 1, so this
          # must stay empty there. tests/ci-full-lane-sharding.test.cjs pins both
          # halves of this contract. Reserve-value derivation:
          # .gsd/bug/fix-4070-shard1-aux-suite-budget/10-diagnosis.md.
          RUN_TESTS_SHARD_RESERVE: ${{ matrix.scope == 'full' && '1:77' || '' }}
        run: npm run test:coverage:unit:raw -- --shard ${{ matrix.shard }}

      # Raw V8 dumps, not rendered reports — coverage-gate merges these. They
      # compress hard in the artifact zip, but they are still bulk: keep the
      # retention at one day so they cannot accumulate against the org quota.
      - name: Upload raw coverage for merge
        if: matrix.scope == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-tmp-shard-${{ strategy.job-index }}
          path: coverage/tmp
          if-no-files-found: error
          retention-days: 1

      # The aux suites cost ~216-224s combined (#4070 — see the "Run unit
      # tests" step's RUN_TESTS_SHARD_RESERVE env comment) and are unsharded —
      # running them on every shard would triple their process-spawn overhead
      # for no signal (install/slow spawn real subprocesses per test). That
      # fixed cost is reserved out of shard 1's unit-test share above instead.
      - name: Run integration tests
        if: matrix.scope == 'full' && matrix.shard == '1/3'
        run: npm run test:integration

      - name: Run security tests
        if: matrix.scope == 'full' && matrix.shard == '1/3'
        run: npm run test:security

      - name: Run install tests
        if: matrix.scope == 'full' && matrix.shard == '1/3' && needs.changes.outputs.full_matrix == 'true'
        run: npm run test:install

      - name: Run slow tests
        if: matrix.scope == 'full' && matrix.shard == '1/3' && needs.changes.outputs.full_matrix == 'true'
        run: npm run test:slow

      - name: Check job budget (near-cap advisory)
        if: always()
        continue-on-error: true
        env:
          CI_JOB_LABEL: "test (${{ matrix.os }}, ${{ matrix.node-version }}${{ matrix.shard && format(', shard {0}', matrix.shard) || '' }})"
          CI_JOB_TIMEOUT_MINUTES: '32'
        run: node scripts/ci-check-job-near-cap.cjs

  test-inert:
    name: test (inert CI)
    needs: [changes, preflight]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.product_changed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSD_PLUGIN_ROOT: .ci-gsd-plugin-root-disabled
      # #2665: ubuntu-only lane — strict unconditionally (see the `test` job note).
      GSD_STRICT_LIVE_CONFIG_GUARD: '1'
      # #2854: same pin as the other rebase-merged lanes. This lane runs a targeted
      # list that can include the emitted gate, and the invariant is easier to keep
      # with no exceptions: if a job merges a pinned base, the gate uses that base.
      GSD_EMITTED_BASE: ${{ github.event.pull_request.base.sha }}
      # #4196: pin the npm-audit baseline the SAME way GSD_EMITTED_BASE pins
      # its own baseline (see the comment above) -- origin/next is live under
      # fetch-depth: 0 and can advance mid-run; base.sha is fixed for the life
      # of the run. For a push event, github.event.before is git's own record
      # of the ref's state immediately before this push landed -- correct
      # even when a rebase-merged PR lands as multiple discrete commits in
      # one push (HEAD~1 would be wrong there: it could already contain an
      # earlier commit's newly-introduced vulnerable package, masking it).
      # #4241: a merge_group event carries no pull_request/push context, so
      # without this arm it silently fell through to the '' branch --
      # resolveBaselineRef()'s documented-unreachable origin/next live-tip
      # fallback (npm-audit-baseline.cjs), reopening the exact race #4196
      # fixed, but only for merge-queue runs. github.event.merge_group.base_sha
      # is "the SHA of the merge group's parent commit" (GitHub's merge_group
      # webhook payload) -- the base tip the temporary merge-group commit was
      # built against, pinned for the life of the run same as the other two arms.
      AUDIT_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}
      - name: Guard — require GitHub-hosted runner
        run: node scripts/ci-guard-runner.cjs
      - name: Rebase check — merge PR base branch into PR head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pin every job of this run to ONE base commit (#2472). Each job runs
          # this step independently, minutes apart across a 12-job matrix, so
          # merging the moving branch ref lets jobs see different trees when the
          # base advances mid-run. The sharded lane needs all jobs to agree on a
          # partition, and disagreement there drops a test file silently while
          # CI stays green. base.sha is fixed for the life of the run.
          CI_REBASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-rebase-check.cjs
      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Environment check
        run: npm run check:env
      - name: Install dependencies
        run: npm ci
      - name: Dependency integrity gate
        run: node scripts/check-npm-integrity.cjs
      - name: Prepare scoped test list
        env:
          TEST_SCOPE: targeted
          TARGETED_TESTS: ${{ needs.changes.outputs.targeted_tests }}
          WINDOWS_TESTS: ${{ needs.changes.outputs.windows_tests }}
        run: node scripts/ci-prepare-test-scope.cjs
      - name: Run scoped tests
        run: node scripts/run-tests.cjs --files-from .ci-selected-tests.txt

  test-full:
    name: full test (${{ matrix.os }}, ${{ matrix.node-version }}, shard ${{ matrix.shard }}/3)
    needs: [changes, preflight]
    if: needs.changes.outputs.code_changed == 'true' && needs.changes.outputs.full_matrix == 'true'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    # The unit suite is sharded across 3 parallel runners per OS/node leg
    # (#1212, cost-weighted in #2472). Each shard runs a deterministic
    # cost-balanced third of the sorted unit-file list via
    # `run-tests.cjs --suite unit --shard i/3`, so per-job
    # wall-clock scales as O(total/3) and stays well under the cap as the suite
    # grows — replacing the #869 timeout bump (15→20m) which only deferred the
    # cliff. The cap stays at 20m as a generous backstop; a healthy shard now
    # finishes in roughly a third of the old single-lane wall-clock.
    #
    # The matrix is the cross-product of 2 OS/node legs × 3 shards = 6 jobs
    # (windows-latest/24, macos-latest/24 — the Node floor is 24, so there is
    # no separate node-22 leg to cross-product against), enumerated explicitly
    # as `include:` rows. (A base `shard: [1,2,3]`
    # dimension would NOT cross-product against `include` legs — include rows
    # sharing no key with the base matrix are appended as standalone combos —
    # and a NESTED `leg.os` key is not resolvable by the H1 shell-policy linter
    # in scripts/workflow-policy.cjs, which reads `matrix.os`/`matrix.shell`
    # directly. Explicit rows keep both the cross-product and the linter happy.)
    # #2952: `full test (windows-latest, 22, shard 3/3)` reached 18m59s (94% of
    # a 20-minute cap) on 05b170e44 and 18m14s (91%) on 81eeb8a53. The Windows
    # shards are slow for platform reasons — process spawn and filesystem cost,
    # not extra work — and this lane has already blown its cap twice before
    # (#1051, #1212).
    # #3787: fresh measurement on windows-latest/24 shard 3/3 hit 26m18s (run
    # 32614439702), so the 18m59s figure above is stale and the 30-minute cap
    # only had ~1.14x headroom, in violation of this repo's own 1.5x rule
    # (tests/ci-test-job-timeout-budget.test.cjs). 1.5x of 27m requires 41m
    # minimum; 45 is used instead of the bare minimum because shard
    # composition is unstable — adding one test file reshuffled 115 of 268
    # unit files between shards — so the per-shard worst case moves run to
    # run and a budget pinned to the exact minimum would be re-breached by
    # the next file anyone adds.
    timeout-minutes: 45
    env:
      GSD_PLUGIN_ROOT: .ci-gsd-plugin-root-disabled
      # #2665: strict on Linux/macOS, report-only on Windows (see the `test` job note).
      GSD_STRICT_LIVE_CONFIG_GUARD: ${{ matrix.os != 'windows-latest' && '1' || '' }}
      # #2854: pin the emitted gate's baseline to the SAME commit the tree was merged
      # with. "Rebase check" merges `pull_request.base.sha` (pinned by #2472 so all 12
      # matrix jobs agree on one tree), but `resolveBase()` otherwise falls through to
      # `origin/next`, which `fetch-depth: 0` leaves at the LIVE tip. Whenever `next`
      # advanced mid-flight the gate compared a tree built on base.sha against a
      # baseline at a newer commit — so the correctly-keyed cache was rejected as
      # "stale" and the run hard-failed on diffs that touched nothing related.
      # This must stay equal to CI_REBASE_BASE_SHA; a test asserts that parity.
      GSD_EMITTED_BASE: ${{ github.event.pull_request.base.sha }}
      # #4196: pin the npm-audit baseline the SAME way GSD_EMITTED_BASE pins
      # its own baseline (see the comment above) -- origin/next is live under
      # fetch-depth: 0 and can advance mid-run; base.sha is fixed for the life
      # of the run. For a push event, github.event.before is git's own record
      # of the ref's state immediately before this push landed -- correct
      # even when a rebase-merged PR lands as multiple discrete commits in
      # one push (HEAD~1 would be wrong there: it could already contain an
      # earlier commit's newly-introduced vulnerable package, masking it).
      # #4241: a merge_group event carries no pull_request/push context, so
      # without this arm it silently fell through to the '' branch --
      # resolveBaselineRef()'s documented-unreachable origin/next live-tip
      # fallback (npm-audit-baseline.cjs), reopening the exact race #4196
      # fixed, but only for merge-queue runs. github.event.merge_group.base_sha
      # is "the SHA of the merge group's parent commit" (GitHub's merge_group
      # webhook payload) -- the base tip the temporary merge-group commit was
      # built against, pinned for the life of the run same as the other two arms.
      AUDIT_BASELINE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && github.event.before) || (github.event_name == 'merge_group' && github.event.merge_group.base_sha) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            node-version: 24
            shell: pwsh
            shard: 1
          - os: windows-latest
            node-version: 24
            shell: pwsh
            shard: 2
          - os: windows-latest
            node-version: 24
            shell: pwsh
            shard: 3
          - os: macos-latest
            node-version: 24
            shell: 'zsh {0}'
            shard: 1
          - os: macos-latest
            node-version: 24
            shell: 'zsh {0}'
            shard: 2
          - os: macos-latest
            node-version: 24
            shell: 'zsh {0}'
            shard: 3

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1 (Windows)
        if: runner.os == 'Windows'
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2 (Linux/macOS)
        if: runner.os != 'Windows'
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Record job start time (near-cap check)
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "CI_JOB_START_EPOCH_MS=" + Date.now() + "\n")'

      - name: Guard — require GitHub-hosted runner
        run: node scripts/ci-guard-runner.cjs

      - name: Rebase check — merge PR base branch into PR head
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Pin every job of this run to ONE base commit (#2472). Each job runs
          # this step independently, minutes apart across a 12-job matrix, so
          # merging the moving branch ref lets jobs see different trees when the
          # base advances mid-run. The sharded lane needs all jobs to agree on a
          # partition, and disagreement there drops a test file silently while
          # CI stays green. base.sha is fixed for the life of the run.
          CI_REBASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-rebase-check.cjs

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Environment check
        run: npm run check:env

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity gate
        run: node scripts/check-npm-integrity.cjs

      # #2724 (ADR-2719 §5): restore the differential attribution check's cached
      # baseline, keyed on the PR's base sha. A miss degrades to an in-job build
      # rather than failing (resolveBaseline()'s documented precedence).
      - name: Restore emitted-baseline cache
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .gsd-cache/emitted-baseline.json
          key: emitted-baseline-${{ github.event.pull_request.base.sha }}

      # The heavy unit suite is split across the 3 shards — each runs a
      # deterministic cost-balanced third of the sorted unit-file list (#2472). The
      # union of shards 1/3 + 2/3 + 3/3 is the full unit suite, so coverage is
      # unchanged; only wall-clock per job drops to ~total/3.
      - name: Run unit tests (shard ${{ matrix.shard }}/3)
        run: node scripts/run-tests.cjs --suite unit --shard ${{ matrix.shard }}/3

      # Integration and security suites are small; run them once per OS/node
      # leg (on shard 1 only) instead of redundantly on all three shards. They
      # still run on every leg (3 times total, once per platform), so each
      # platform's integration/security coverage is unchanged — only the
      # 3x-per-leg duplication is removed.
      - name: Run integration tests
        if: matrix.shard == 1
        run: npm run test:integration

      - name: Run security tests
        if: matrix.shard == 1
        run: npm run test:security

      - name: Check job budget (near-cap advisory)
        if: always()
        continue-on-error: true
        env:
          CI_JOB_LABEL: "full test (${{ matrix.os }}, ${{ matrix.node-version }}, shard ${{ matrix.shard }}/3)"
          CI_JOB_TIMEOUT_MINUTES: '45'
        run: node scripts/ci-check-job-near-cap.cjs

  # #2952: the coverage gate that the `test` lane used to run inline. Sharding
  # the unit suite means no single runner sees the whole picture, so the gate
  # moves here, downloads every shard's raw V8 dumps into one coverage/tmp, and
  # runs the SAME commands as before against the merged data. Splitting the
  # gate out is what makes sharding safe: nothing about the thresholds or the
  # include/exclude globs changes, only where they are evaluated.
  coverage-gate:
    name: Coverage gate (merged shards)
    needs: [changes, test, preflight]
    if: needs.changes.outputs.product_changed == 'true' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # merge-multiple flattens every shard's dumps into ONE coverage/tmp, which
      # is exactly the layout c8 expects from a single run. The dumps are
      # per-process files with distinct names, so there is nothing to collide.
      - name: Download every shard's raw coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: coverage-tmp-shard-*
          path: coverage/tmp
          merge-multiple: true

      # c8's default --temp-directory is ./coverage/tmp, which is exactly where
      # the download above landed every shard's dumps — so these run unmodified
      # against merged data and the thresholds stay defined in package.json.
      # The three merged shard dumps run ~358MB combined; c8 has to parse and
      # hold all of their per-file position maps in memory at once to render a
      # report, which blows past the default ~4GB V8 heap (observed: FATAL
      # ERROR: Ineffective mark-compacts near heap limit). 8192 doubles that
      # with headroom to spare on the 16GB ubuntu-latest runner. This is a
      # memory bound only — it does not change what is measured or the
      # thresholds below.
      - name: Report merged coverage + gate gsd-core/bin/lib (≥70% lines, ≥60% branches)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run test:coverage:report

      # Second-tier floor over the CI/release/lint tooling itself. Re-slices the
      # SAME merged V8 data — no extra suite execution. Audit 2026-06: scripts/
      # measured 65.95%; the 55% floor prevents a collapse to zero-coverage
      # tooling while leaving headroom for variance. Raise deliberately, never lower.
      # Re-slices the same ~358MB merged dumps as the step above, so it carries
      # the same larger heap for the same reason — see that step's comment.
      - name: Coverage floor — scripts/ tooling (≥55%)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run test:coverage:scripts-floor

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-unit-merged
          path: |
            coverage/
            !coverage/tmp
          if-no-files-found: ignore
          retention-days: 3

  # #2966: turns a loop QA-walk "smell" into a decision — see
  # scripts/qa-smell-ratchet.cjs's own header for the full design invariant.
  # Gated the same way as `test`/`coverage-gate` (product_changed only): the
  # scenarios drive the real gsd-tools binary end-to-end, so there is nothing
  # to walk on a docs-only change.
  qa-loop-walk:
    name: QA loop walk (smell ratchet)
    needs: [changes, preflight]
    if: needs.changes.outputs.product_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GSD_PLUGIN_ROOT: .ci-gsd-plugin-root-disabled
      # `npm run test:qa` is `run-tests.cjs --suite qa`, so this lane runs the
      # live-config guard like every other suite lane. ubuntu-only, so strict
      # unconditionally — the Windows carve-out does not apply here.
      GSD_STRICT_LIVE_CONFIG_GUARD: '1'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ github.token }}

      - name: Guard — require GitHub-hosted runner
        run: node scripts/ci-guard-runner.cjs

      - name: Set up Node.js 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Environment check
        run: npm run check:env

      - name: Install dependencies
        run: npm ci

      - name: Dependency integrity gate
        run: node scripts/check-npm-integrity.cjs

      - name: Build runtime lib (required by the QA walk's gsd-tools invocations)
        run: npm run build:lib

      - name: Run QA loop-walk scenarios
        run: npm run test:qa

      # `-- --json qa-report.json` asks the ratchet to also write the full report
      # (its default `npm run lint:qa-smells` invocation does not) — the report is
      # gitignored and exists for the artifact upload below, not for the gate itself.
      - name: QA smell ratchet
        run: npm run lint:qa-smells -- --json qa-report.json

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: qa-report
          path: qa-report.json
          if-no-files-found: ignore
          retention-days: 3

  required-tests:
    name: Required tests
    needs:
      - preflight
      - next-health
      - changes
      - lint-tests
      - test
      - test-inert
      - test-full
      - coverage-gate
      - qa-loop-walk
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Summarize required test gate
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          NEXT_HEALTH_RESULT: ${{ needs.next-health.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code_changed }}
          PRODUCT_CHANGED: ${{ needs.changes.outputs.product_changed }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.lint-tests.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INERT_RESULT: ${{ needs.test-inert.result }}
          FULL_TEST_RESULT: ${{ needs.test-full.result }}
          COVERAGE_GATE_RESULT: ${{ needs.coverage-gate.result }}
          QA_LOOP_WALK_RESULT: ${{ needs.qa-loop-walk.result }}
        run: |
          set -euo pipefail
          echo "preflight=$PREFLIGHT_RESULT"
          echo "next-health=$NEXT_HEALTH_RESULT"
          echo "code_changed=$CODE_CHANGED"
          echo "product_changed=$PRODUCT_CHANGED"
          echo "changes=$CHANGES_RESULT"
          echo "lint-tests=$LINT_RESULT"
          echo "test=$TEST_RESULT"
          echo "test-inert=$INERT_RESULT"
          echo "test-full=$FULL_TEST_RESULT"
          echo "coverage-gate=$COVERAGE_GATE_RESULT"
          echo "qa-loop-walk=$QA_LOOP_WALK_RESULT"

          # #3833: the preflight arm comes FIRST and reports its own cause.
          # Without it a conflicted PR skips `changes` too, and this gate would
          # blame scope detection for a merge conflict. It also matters that
          # this job stays `if: always()` and exits NON-ZERO here: a required
          # status check that merely goes absent does not block a merge (see
          # the mutation-gate note in mutation.yml, #3319), so the required
          # `Required tests` context has to actually report red.
          if [ "$PREFLIGHT_RESULT" != "success" ]; then
            echo "::error::PR mergeability preflight did not pass ($PREFLIGHT_RESULT) — resolve the merge conflict and push again; no test lane runs until then"
            exit 1
          fi

          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::test scope detection did not pass"
            exit 1
          fi

          # #4422: applies UNCONDITIONALLY, not nested inside the
          # PRODUCT_CHANGED/CODE_CHANGED branches below — a red base branch
          # must block every PR, including doc-only ones.
          if [ "$NEXT_HEALTH_RESULT" != "success" ]; then
            echo "::error::the base branch's own last Tests run is red — see the 'Base branch health' job above for the failing run. Wait for a fix-forward merge, or if this PR IS the fix, ask a maintainer to apply the 'fix-next' label to override."
            exit 1
          fi

          if [ "$LINT_RESULT" != "success" ]; then
            echo "::error::lint-tests did not pass"
            exit 1
          fi

          if [ "$CODE_CHANGED" != "true" ]; then
            echo "No code paths changed; matrix tests intentionally skipped."
            exit 0
          fi

          if [ "$PRODUCT_CHANGED" = "true" ]; then
            if [ "$TEST_RESULT" != "success" ]; then
              echo "::error::test matrix did not pass"
              exit 1
            fi
            # #2952: the coverage gates no longer run inside the `test` matrix —
            # sharding moved them to the `coverage-gate` job, which merges every
            # shard's dumps. TEST_RESULT therefore does NOT cover them any more;
            # COVERAGE_GATE_RESULT below is what gates coverage.
            if [ "$FULL_TEST_RESULT" != "success" ] && [ "$FULL_TEST_RESULT" != "skipped" ]; then
              echo "::error::full parity matrix did not pass"
              exit 1
            fi

            # #2952: the coverage gate is skipped when product code did not change
            # (same condition as the test lane). Only a non-success, non-skipped
            # result is a failure — treating `skipped` as red would block every
            # docs-only PR.
            if [ "$COVERAGE_GATE_RESULT" != "success" ] && [ "$COVERAGE_GATE_RESULT" != "skipped" ]; then
              echo "::error::coverage-gate did not pass"
              exit 1
            fi

            # #2966: same product_changed-only gating as coverage-gate above.
            if [ "$QA_LOOP_WALK_RESULT" != "success" ] && [ "$QA_LOOP_WALK_RESULT" != "skipped" ]; then
              echo "::error::qa-loop-walk did not pass"
              exit 1
            fi
          else
            if [ "$INERT_RESULT" != "success" ]; then
              echo "::error::inert CI lane did not pass"
              exit 1
            fi
          fi

          echo "Required test gate passed."

  # #2724 (ADR-2719 §5): publishes the differential attribution check's baseline
  # artifact after `next` advances, keyed on the merge sha. PR lanes restore it
  # (see the `test` and `test-full` jobs' "Restore emitted-baseline cache" steps),
  # keyed on `pull_request.base.sha` — "the next sha the PR was merged with", the
  # ADR's own phrasing. Not required by `required-tests`: a miss here degrades PR
  # lanes to an in-job build (resolveBaseline()'s documented precedence) rather
  # than failing them, so this job's own failure must not block `next`.
  publish-emitted-baseline:
    name: Publish emitted-baseline artifact
    needs: [changes, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/next' && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: true
          token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build emitted-baseline artifact
        run: node scripts/gen-emitted-baseline.cjs --out .gsd-cache/emitted-baseline.json

      - name: Publish baseline cache (keyed on this sha)
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: .gsd-cache/emitted-baseline.json
          key: emitted-baseline-${{ github.sha }}
