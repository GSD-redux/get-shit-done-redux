name: Mutation Testing

# PR-GATING: runs on every pull_request targeting `next` or `main`.
# scripts/mutation-matrix.cjs is the single source of truth for which modules
# are "covered" (have meaningful test coverage for mutation). It computes
# changed modules from git diff and emits a GitHub Actions matrix so each
# changed module gets its own Stryker shard running in parallel.
# If no covered modules changed the gate is skipped, not trivially passed (has_work: false).

on:
  pull_request:
    branches:
      - next
      - main
    paths:
      # Only run when lib source, property/unit tests, or mutation config change
      - 'src/**/*.cts'
      - 'gsd-core/bin/lib/**/*.cjs'
      - 'tests/**/*.property.test.cjs'
      - 'tests/**/*.unit.test.cjs'
      - 'tests/adr-parser.test.cjs'
      - 'tests/active-workstream-store.test.cjs'
      - 'tests/core-utils.test.cjs'
      - 'stryker.config.mjs'
      - 'scripts/mutation-matrix.cjs'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Job 1: detect ─────────────────────────────────────────────────────────
  # Computes which covered modules changed and emits a matrix for the mutate job.
  # Intentionally does NOT run npm ci — it only needs git + Node builtins.
  # #3833: no compute lane runs while the PR has a merge conflict.
  preflight:
    name: PR mergeability
    uses: ./.github/workflows/pr-mergeable-preflight.yml
    permissions:
      contents: read
      pull-requests: read

  detect:
    name: Detect changed covered modules
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      has_work: ${{ steps.matrix.outputs.has_work }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch base ref for diff
        # Ensure the base branch tip is available for the git diff below.
        # fetch-depth: 0 above gets all history, but the remote ref name must exist.
        # For workflow_dispatch (no base_ref) we fall back to `next`.
        #
        # Do NOT pass --depth here (#2452): a shallow re-fetch truncates the
        # freshly-fetched `next` history to a single commit, so the three-dot
        # `origin/next...HEAD` diff in scripts/mutation-matrix.cjs can no longer
        # compute a merge base and dies with `fatal: ... no merge base`. That
        # only happens when the branch is BEHIND the base — an up-to-date branch
        # incidentally passes because its merge base IS the fetched tip — which
        # made the gate fail exactly on the PRs that most needed it, while the
        # `mutate` shards never ran at all.
        #
        # BASE_NAME goes through `env:` rather than being interpolated straight
        # into the shell, matching changeset-required.yml / docs-required.yml.
        run: git fetch origin "${BASE_NAME}"
        env:
          BASE_NAME: ${{ github.base_ref || 'next' }}

      - name: Compute mutation matrix
        id: matrix
        env:
          BASE_NAME: ${{ github.base_ref || 'next' }}
        run: |
          BASE_REF="origin/${BASE_NAME}"
          # Run the matrix script; capture the JSON output.
          JSON=$(node scripts/mutation-matrix.cjs --base "${BASE_REF}")

          # Extract has_work and the compact matrix string for GITHUB_OUTPUT.
          HAS_WORK=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).has_work)" <<< "${JSON}")
          MATRIX=$(node -e "process.stdout.write(JSON.stringify(JSON.parse(require('fs').readFileSync('/dev/stdin','utf8')).matrix))" <<< "${JSON}")

          echo "has_work=${HAS_WORK}" >> "${GITHUB_OUTPUT}"
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

          # Human-readable summary for the step log.
          echo "has_work=${HAS_WORK}"
          echo "${JSON}"

  # ── Job 2: mutate ──────────────────────────────────────────────────────────
  # One shard per changed covered module, each running only that module's tests.
  # Skipped entirely when detect reports no covered files changed.
  mutate:
    name: Stryker (${{ matrix.name }})
    needs: detect
    if: needs.detect.outputs.has_work == 'true'
    # GitHub-hosted runners only. Speed comes from running shards in PARALLEL
    # (one job per changed module), not from larger/3rd-party runners.
    runs-on: ubuntu-latest
    # Per-shard; lower than the old 30-min serial budget. Matrix-driven so only shards that
    # document a measured need (mutation-matrix.cjs COVERED[<module>].timeoutMinutes, e.g.
    # frontmatter's 60) get more; every other shard keeps the 15-minute default emitted by
    # buildResult() in scripts/mutation-matrix.cjs.
    timeout-minutes: ${{ matrix.timeoutMinutes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Record job start time (near-cap check)
        run: echo "CI_JOB_START_EPOCH_MS=$(( $(date +%s) * 1000 ))" >> "$GITHUB_ENV"

      - name: Set up Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (builds .cjs via prepare)
        run: npm ci

      - name: Run Stryker — ${{ matrix.name }}
        # MUTATION_TEST_FILES supplies the per-shard tap.testFiles list to
        #   stryker.config.mjs (resolveMutationTestFiles). With coverageAnalysis:
        #   perTest, Stryker re-runs only the files that actually cover each mutant
        #   rather than the whole list per mutant (#3915: tap-runner swap).
        # --mutate scopes mutation to only the changed module's built artifact.
        # --incremental reuses cached results for unchanged mutants.
        # MUTATION_BREAK passes the per-module minScore ratchet floor to
        #   stryker.config.mjs (which reads process.env.MUTATION_BREAK for the
        #   break threshold). See ADR-456 / issue #1187.
        #   Note: Stryker 9.x has no --break CLI flag; the threshold is config-only.
        # Every matrix value is bound here and referenced as a shell variable
        # below. CONTRIBUTING.md's final rule forbids `${{ }}` inside a `run:`
        # block outright — binding via `env:` is the sanctioned form. Fixed as
        # part of #3833 rather than left in place for the next reader, per the
        # repo's no-defer rule.
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
          MUTATION_TEST_FILES: ${{ matrix.tests }}
          MUTATION_BREAK: ${{ matrix.minScore }}
          MODULE_NAME: ${{ matrix.name }}
          MUTATE_GLOB: ${{ matrix.mutate }}
        run: |
          echo "Module:   ${MODULE_NAME}"
          echo "Mutate:   ${MUTATE_GLOB}"
          echo "Tests:    ${MUTATION_TEST_FILES}"
          echo "MinScore: ${MUTATION_BREAK}"
          npx stryker run --incremental --mutate "${MUTATE_GLOB}"

      - name: Check score ratchet — ${{ matrix.name }}
        # #3881 follow-up, mutation-matrix piece 3: only runs when the shard above actually
        # passed (a failed shard is a floor problem — Stryker's own MUTATION_BREAK exit code
        # already reports that; this step is strictly about a floor that should be RAISED).
        # Reads the 'json' reporter's reports/mutation/mutation.json (stryker.config.mjs)
        # and fails, with the exact remedy, when the achieved score clears the module's
        # declared floor by more than scripts/check-mutation-score-ratchet.cjs's documented
        # slack — the "ratchet up" half of the piece-3 requirement. The "never lower without
        # a reasoned marker" half is enforced separately, at review time, by
        # tests/mutation-matrix-ratchet.test.cjs's RATCHET_BASELINE equality check.
        if: success()
        env:
          MODULE_NAME: ${{ matrix.name }}
        run: node scripts/check-mutation-score-ratchet.cjs --module "${MODULE_NAME}"

      - name: Upload mutation report — ${{ matrix.name }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()  # upload even on failure so the score is visible
        with:
          name: mutation-report-${{ matrix.name }}-${{ github.run_number }}
          path: reports/mutation/mutation.html
          retention-days: 14

      - name: Check job budget (near-cap advisory)
        if: always()
        continue-on-error: true
        env:
          CI_JOB_LABEL: "Stryker (${{ matrix.name }})"
          CI_JOB_TIMEOUT_MINUTES: ${{ matrix.timeoutMinutes }}
        run: node scripts/ci-check-job-near-cap.cjs

  # ── Job 3: mutation-gate ───────────────────────────────────────────────────
  # Stable required-check name for branch protection.
  #   • has_work is false → job is SKIPPED (not run) — nothing to mutate is not
  #     the same claim as "mutated and passed" (#3319).
  #   • has_work is true and all mutate shards succeeded → PASSES.
  #   • has_work is true and any shard failed, or detect itself failed → FAILS.
  # Summary job keeps the LEGACY check name so existing branch protection
  # (which requires "Stryker mutation score (changed files only)") needs no
  # change. The per-module shards report as "Stryker (<module>)".
  mutation-gate:
    name: Stryker mutation score (changed files only)
    needs: [detect, mutate, preflight]
    # has_work=false is rendered by SKIPPING this job entirely (job-level `if:`), not by an
    # early `exit 0` inside the step — a step that runs and exits 0 always reports `success`,
    # indistinguishable in the UI from "evaluated and passed". A job-level-skipped job reports
    # `skipped` instead, matching the `coverage-gate` precedent in test.yml, and (verified)
    # skipped required checks do not block merge. See #3319.
    if: always() && (needs.detect.result != 'success' || needs.detect.outputs.has_work == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        # Values arrive through `env:`, never interpolated into the script body —
        # CONTRIBUTING.md's final rule. They were inline `${{ }}` until #3833
        # touched this job; fixed here rather than left for the next reader.
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          DETECT: ${{ needs.detect.result }}
          MUTATE: ${{ needs.mutate.result }}
        run: |
          echo "preflight result : ${PREFLIGHT}"
          echo "detect result : ${DETECT}"
          echo "mutate result : ${MUTATE}"

          # #3833: report the real cause first. Without this arm a conflicted PR
          # skips `detect` and the gate blames scope detection for a conflict.
          if [ "${PREFLIGHT}" != "success" ]; then
            echo "FAIL: PR mergeability preflight did not pass (${PREFLIGHT}) — resolve the merge conflict and push again"
            exit 1
          fi

          if [ "${DETECT}" != "success" ]; then
            echo "FAIL: detect job did not succeed (${DETECT})"
            exit 1
          fi

          if [ "${MUTATE}" = "success" ]; then
            echo "PASS: all mutation shards passed"
            exit 0
          fi

          echo "FAIL: one or more mutation shards failed or were cancelled (${MUTATE})"
          exit 1
